name: basirah-crypto-lab
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./config.json:/freqtrade/config.json:ro
      - ./private/telegram.json:/freqtrade/telegram.json:ro
    command: >-
      trade --dry-run
      --config /freqtrade/config.json
      --config /freqtrade/telegram.json
      --strategy ArabicLearningStrategy
      --db-url sqlite:////freqtrade/user_data/basirah-paper.sqlite
      --logfile /freqtrade/user_data/logs/freqtrade.log
